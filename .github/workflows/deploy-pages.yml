# Publishes public/ to GitHub Pages and keeps listings fresh.
#  - Every push to main: rebuilds the live-listings file (USAJOBS) and deploys.
#  - Every Monday, a manual run, or a push while no finds are saved yet: also runs the AI web search for new summer
#    programs, internships and volunteering, re-checks earlier finds, saves them
#    to data/found-listings.json, and deploys.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * 1"   # Mondays, about 5-6am Central
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Refresh listings
        id: refresh
        run: |
          # Run the AI web search on the weekly schedule, on manual runs, and on
          # any push while there are no saved finds yet (so a new site fills up).
          if [ "${{ github.event_name }}" != "push" ] || [ ! -f data/found-listings.json ]; then
            export RESEARCH=true
            echo "research=true" >> "$GITHUB_OUTPUT"
          fi
          node scripts/update-listings.mjs
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Save new finds to the repo
        if: steps.refresh.outputs.research == 'true'
        run: |
          git config user.name "interloop-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No listing changes."; exit 0; fi
          git commit -m "Weekly listings update"
          git pull --rebase origin main && git push origin HEAD:main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
